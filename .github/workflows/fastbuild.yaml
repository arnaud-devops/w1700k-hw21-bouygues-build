name: build W1700K HW2.1 Bouygues v2.4

on:
  workflow_dispatch:

permissions:
  actions: write
  attestations: write
  contents: write
  id-token: write
  packages: write

concurrency:
  group: w1700k-hw21-bouygues-v24-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        target:
          - ubi2-hw21-bouygues-v24
    env:
      DK_OPENWRT: /bld/openwrt
      DK_BIN: /bld/openwrt_bin
      DK_USER: /bld/user
      DK_PROFILE: /bld/user/current
      GH_TOKEN: ${{ github.token }}
      CACHE_EPOCH: hurryman25-hw21-v2.4-native-kmods
      UPSTREAM_BUILDER_IMAGE: ghcr.io/w1700k/fastbuild_base@sha256:88dac182e7327e61d76aba0836d1c16924cee7fd0407b41e561d1fb514b3acd9
      BUILDER_IMAGE: ghcr.io/${{ github.repository_owner }}/w1700k-hw21-bouygues-builder@sha256:88dac182e7327e61d76aba0836d1c16924cee7fd0407b41e561d1fb514b3acd9
      BUILDER_MIRROR_TAG: ghcr.io/${{ github.repository_owner }}/w1700k-hw21-bouygues-builder:fastbuild-base-88dac182e732
      CACHE_SEED_IMAGE: ghcr.io/w1700k/fastbuild_base@sha256:cedaa381cc2d13926920e45f2f26ac1c67e8541fd28aeea3f781c1583542b322

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Ensure immutable builder mirror
        run: |
          set -euo pipefail
          expected=${BUILDER_IMAGE##*@}
          if ! docker pull "$BUILDER_IMAGE"; then
            docker pull "$UPSTREAM_BUILDER_IMAGE"
            actual=$(docker image inspect --format '{{index .RepoDigests 0}}' "$UPSTREAM_BUILDER_IMAGE")
            [ "${actual##*@}" = "$expected" ] || {
              echo "::error::Upstream builder digest differs from the pinned digest"
              exit 1
            }
            docker tag "$UPSTREAM_BUILDER_IMAGE" "$BUILDER_MIRROR_TAG"
            docker push "$BUILDER_MIRROR_TAG"
            pulled=false
            for delay in 1 2 4 8; do
              if docker pull "$BUILDER_IMAGE"; then
                pulled=true
                break
              fi
              sleep "$delay"
            done
            [ "$pulled" = true ] || {
              echo "::error::Immutable builder mirror is unavailable"
              exit 1
            }
          fi
          actual=$(docker image inspect --format '{{index .RepoDigests 0}}' "$BUILDER_IMAGE")
          [ "${actual##*@}" = "$expected" ] || {
            echo "::error::Mirrored builder digest differs from the pin"
            exit 1
          }

      - id: gh
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ghcache
            stcache
          key: cache-${{ matrix.target }}.${{ env.CACHE_EPOCH }}.${{ github.run_id }}
          restore-keys: cache-${{ matrix.target }}.${{ env.CACHE_EPOCH }}.

      - id: dl
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: dlcache
          key: dlcache.${{ github.run_id }}
          restore-keys: dlcache.

      - name: Seed caches if missing
        run: |
          set -euo pipefail
          mkdir -p openwrt_bin ghcache stcache dlcache
          if [ -z "$(ls -A ghcache 2>/dev/null)" ] ||
            [ -z "$(ls -A stcache 2>/dev/null)" ]; then
            if docker pull "$CACHE_SEED_IMAGE" 2>/dev/null; then
              docker create --name CA "$CACHE_SEED_IMAGE" >/dev/null
              for dir in ghcache stcache dlcache; do
                docker cp "CA:/$dir/." "$dir"
              done
            else
              echo "::notice::UBI2 cache seed unavailable; using empty caches"
            fi
          fi
          if [ ! -f "stcache/.${CACHE_EPOCH}" ]; then
            rm -rf stcache/target-*
            touch "stcache/.${CACHE_EPOCH}"
          fi
          sudo find stcache -type d -name 'root-*' -prune -exec rm -rf {} +

      - name: Initialize deterministic environment
        run: |
          set -euo pipefail
          profile="user/${{ matrix.target }}"
          [ -s "$profile/config.diff" ] || {
            echo "::error::Missing profile config: $profile/config.diff"
            exit 1
          }
          # Merge shared defaults first, then make the target profile
          # authoritative. Remove shared developer-only helpers explicitly.
          rsync -aI --mkpath user/default/ "$profile/" user/current/
          cp -a "$profile/custom.sh" user/current/custom.sh
          cp -a "$profile/excluded-patches.sha256" user/current/excluded-patches.sha256
          rm -f \
            user/current/files/998-single-wiphy.patch \
            user/current/files/overview.js \
            user/current/files/etc/fe_debug_reg.sh \
            user/current/files/etc/fe_reg.sh \
            user/current/files/etc/gsw_status.sh \
            user/current/files/etc/md.sh \
            user/current/files/etc/testgpio.sh \
            user/current/files/etc/xsi_mac_dbg.sh \
            user/current/files/www/cgi-bin/github_check \
            user/current/files/www/cgi-bin/github_fetch
          echo 'CONFIG_CCACHE_DIR="/ghcache"' >> user/current/config.diff

          # The release URL is embedded before compilation. It is immutable and
          # points to the native package repository produced by this same run.
          # shellcheck disable=SC1090
          . "$profile/settings.ini"
          release_tag="${{ matrix.target }}_$(date -u +'%Y.%m.%d')_${SOURCE_VERSION_CODE}_${GITHUB_SHA::7}"
          printf '%s\n' "$release_tag" > openwrt_bin/release_tag

          sudo tee /etc/docker/daemon.json >/dev/null <<'JSON'
          {"max-concurrent-downloads":50,"max-concurrent-uploads":50,"experimental":true}
          JSON
          sudo systemctl reload docker
          docker pull "$BUILDER_IMAGE"
          docker run -dt --name DK \
            -v "$PWD/user:$DK_USER" \
            -v "$PWD/openwrt_bin:$DK_BIN" \
            -v "$PWD/ghcache:/ghcache" \
            -v "$PWD/stcache:/stcache" \
            -v "$PWD/dlcache:/dlcache" \
            "$BUILDER_IMAGE"
          sudo install -m 0755 /dev/stdin /usr/local/bin/docker_exec <<'DKR'
          #!/bin/bash
          set -e
          for n in BUILDER_IMAGE DK_BIN DK_USER DK_PROFILE DK_OPENWRT; do
            e+=(-e "$n=${!n}")
          done
          exec docker exec -u 0 -i "${e[@]}" "$@"
          DKR

      - name: Prepare and audit OpenWrt source
        run: |
          # shellcheck disable=SC2016
          docker_exec DK bash -euo pipefail -c '
            verify_tree_lock() {
              root=$1
              lock=$2
              label=$3
              scan=${4:-.}
              [ -s "$lock" ] || {
                echo "::error::Missing $label lock: $lock"
                exit 1
              }
              actual=$(mktemp)
              (
                cd "$root"
                find "$scan" -type f -print0 | sort -z | xargs -0 sha256sum
              ) > "$actual"
              if ! diff -u "$lock" "$actual"; then
                echo "::error::$label differs from its checksum lock"
                rm -f "$actual"
                exit 1
              fi
              rm -f "$actual"
            }

            . "$DK_PROFILE/settings.ini"
            [ -n "$REPO_URL" ] && [ -n "$REPO_BRANCH" ] &&
              [ -n "$REPO_COMMIT" ] || {
              echo "::error::Incomplete immutable source settings"
              exit 1
            }
            cd "$DK_OPENWRT"
            [ -d .git ] || git init
            git remote set-url origin "$REPO_URL" 2>/dev/null ||
              git remote add origin "$REPO_URL"
            git reset --hard HEAD 2>/dev/null || true
            git clean -fdx
            git fetch --prune origin "$REPO_BRANCH"
            git fetch --no-tags origin "$REPO_COMMIT"
            git checkout --detach "$REPO_COMMIT"
            [ "$(git rev-parse HEAD)" = "$REPO_COMMIT" ] || {
              echo "::error::Checked-out source differs from REPO_COMMIT"
              exit 1
            }

            mountpoint "$DK_BIN" || {
              echo "::error::Output directory is not mounted"
              exit 1
            }
            ln -sfn "$DK_BIN" bin
            ln -sfn /dlcache dl
            ln -sfn /stcache staging_dir
            mkdir -p files

            cp feeds.conf.default feeds.conf
            rm -rf feeds
            ./scripts/feeds update -a
            while read -r feed commit; do
              [ -n "$feed" ] && [ -n "$commit" ] || continue
              case "$feed" in \#*) continue ;; esac
              [ -d "feeds/$feed/.git" ] || {
                echo "::error::Locked feed was not cloned: $feed"
                exit 1
              }
              git -C "feeds/$feed" fetch origin "$commit"
              git -C "feeds/$feed" checkout --detach "$commit"
              [ "$(git -C "feeds/$feed" rev-parse HEAD)" = "$commit" ] || {
                echo "::error::Feed lock mismatch: $feed"
                exit 1
              }
            done < "$DK_PROFILE/feeds.lock"

            verify_tree_lock "$DK_PROFILE/feed-patches" \
              "$DK_PROFILE/feed-patches.sha256" "feed patch tree"
            shopt -s nullglob
            for feed_patch in "$DK_PROFILE"/feed-patches/packages/*.patch; do
              git -C feeds/packages apply --check "$feed_patch"
              git -C feeds/packages apply "$feed_patch"
            done
            shopt -u nullglob
            git -C feeds/packages diff --check
            grep -Fq "+nftables-json" \
              feeds/packages/net/trafficshaper/Makefile
            if grep -Fq \
              "(PACKAGE_nftables-json||PACKAGE_nftables-nojson):nftables" \
              feeds/packages/net/trafficshaper/Makefile; then
              echo "::error::trafficshaper recursive nftables provider remains"
              exit 1
            fi
            if grep -Eq "GstBuild(Library,gl|Plugin,opengl)" \
              feeds/packages/multimedia/gst1-plugins-base/Makefile; then
              echo "::error::Unavailable GStreamer GL metadata remains"
              exit 1
            fi
            ./scripts/feeds install -a
            [ -s "$DK_PROFILE/excluded-feed-packages.txt" ] || {
              echo "::error::Missing excluded feed package policy"
              exit 1
            }
            while read -r feed package; do
              [ -n "$feed" ] && [ -n "$package" ] || continue
              case "$feed" in \#*) continue ;; esac
              link="package/feeds/$feed/$package"
              [ -L "$link" ] || {
                echo "::error::Excluded feed package is not a link: $link"
                exit 1
              }
              case "$(readlink "$link")" in
                ../../../feeds/"$feed"/*) ;;
                *)
                  echo "::error::Unexpected excluded feed link target: $link"
                  exit 1
                  ;;
              esac
              unlink "$link"
              [ ! -e "$link" ] && [ ! -L "$link" ] || {
                echo "::error::Failed to exclude feed package metadata: $link"
                exit 1
              }
            done < "$DK_PROFILE/excluded-feed-packages.txt"

            cp "$DK_PROFILE/config.diff" .config
            verify_tree_lock "$DK_PROFILE" "$DK_PROFILE/profile-patches.sha256" \
              "profile patch tree" "./patches"
            shopt -s nullglob
            for profile_patch in "$DK_PROFILE"/patches/*.patch; do
              patch -d . -p0 --forward < "$profile_patch"
            done
            shopt -u nullglob

            verify_tree_lock "$DK_PROFILE/files" \
              "$DK_PROFILE/profile-files.sha256" "profile file tree"
            cp -a --no-preserve=ownership,xattr "$DK_PROFILE/files/." files/
            release_tag=$(cat "$DK_BIN/release_tag")
            sed -i \
              -e "s|@RELEASE_TAG@|$release_tag|g" \
              -e "s|@BUILDER_COMMIT@|${{ github.sha }}|g" \
              files/etc/w1700k-build-release \
              files/etc/apk/repositories.d/customfeeds.list
            if grep -R -Fq "@RELEASE_TAG@" \
              files/etc/w1700k-build-release \
              files/etc/apk/repositories.d/customfeeds.list; then
              echo "::error::Unresolved release placeholder"
              exit 1
            fi

            verify_tree_lock "$DK_PROFILE/source-files" \
              "$DK_PROFILE/source-files.sha256" "source overlay"
            cp -a --no-preserve=ownership,xattr "$DK_PROFILE/source-files/." .
            (cd "$DK_PROFILE" && sha256sum -c profile-hooks.sha256)
            bash "$DK_PROFILE/custom.sh"

            # Immutable source and component pins.
            grep -qx "LINUX_VERSION-6.18 = .39" target/linux/generic/kernel-6.18
            grep -qx \
              "LINUX_KERNEL_HASH-6.18.39 = a7a7e3d2ae9d95e74197223a8d4eb5f6be7aac21b6e6de27e9685d001c1f8cb0" \
              target/linux/generic/kernel-6.18
            grep -qx "PKG_SOURCE_VERSION:=$HOSTAPD_SOURCE_COMMIT" \
              package/network/services/hostapd/Makefile
            grep -qx "PKG_SOURCE_VERSION:=$MT76_SOURCE_COMMIT" \
              package/kernel/mt76/Makefile
            grep -Fq ".match_phy_device = rtl8261ce_match_phy_device" \
              target/linux/generic/files/drivers/net/phy/rtl8261ce/rtk_rtl8261ce_phy.c
            grep -Fq "FIELD_GET(RTL8261CE_PHYID2_MODEL_MASK, phyid2)" \
              target/linux/generic/files/drivers/net/phy/rtl8261ce/rtk_rtl8261ce_phy.c
            grep -Fq "fw4.default_option(\"flow_offloading_bridge\")" \
              package/network/config/firewall4/patches/001-add-bridge-flowtable-support.patch
            grep -Fq "flow_offloading_bridge: [ \"bool\", \"0\" ]" \
              package/network/config/firewall4/patches/001-add-bridge-flowtable-support.patch
            grep -Fq "ramoops@86ff0000" target/linux/airoha/dts/an7581.dtsi
            if grep -R -Fq "../../../files/etc/vermagic.txt" include; then
              echo "::error::Forced buildbot vermagic remains"
              exit 1
            fi
            if find target/linux/airoha -type f -name "9999-*" | grep -q .; then
              echo "::error::SOE/XFRM/LAG experimental patch remains"
              exit 1
            fi
            if grep -Eq "opp-hz = /bits/ 64 <(12[5-9]|1[3-9][0-9])[0-9]{7}>;" \
              target/linux/airoha/dts/an7581.dtsi; then
              echo "::error::CPU OPP above 1.2 GHz remains"
              exit 1
            fi

            {
              echo "Builder repository: ${{ github.server_url }}/${{ github.repository }}"
              echo "Builder commit: ${{ github.sha }}"
              echo "Builder container: $BUILDER_IMAGE"
              echo "Release tag: $release_tag"
              echo "OpenWrt/Hurryman repository: $REPO_URL"
              echo "OpenWrt/Hurryman branch: $REPO_BRANCH"
              echo "OpenWrt/Hurryman commit: $(git rev-parse HEAD)"
              echo "OpenWrt base commit: $UPSTREAM_REPO_COMMIT"
              echo "Bridge userspace reference: $BRIDGE_PR_URL"
              echo "Bridge PR head inspected: $BRIDGE_PR_COMMIT"
              echo "UPDMEM source: $UPDMEM_SOURCE_URL"
              echo "Hostapd commit: $HOSTAPD_SOURCE_COMMIT"
              echo "mt76 commit: $MT76_SOURCE_COMMIT"
              echo "Log viewer commit: $LOG_VIEWER_REPO_COMMIT"
              echo
              echo "Feed commits:"
              while read -r feed _; do
                [ -d "feeds/$feed/.git" ] || continue
                printf "%s " "$feed"
                git -C "feeds/$feed" rev-parse HEAD
              done < "$DK_PROFILE/feeds.lock"
              echo
              echo "Feed metadata patches:"
              cat "$DK_PROFILE/feed-patches.sha256"
              echo
              echo "Excluded feed package metadata:"
              cat "$DK_PROFILE/excluded-feed-packages.txt"
              echo
              echo "Applied profile patches:"
              cat "$DK_PROFILE/profile-patches.sha256"
              echo
              echo "Source overlay:"
              cat "$DK_PROFILE/source-files.sha256"
              echo
              echo "Verified then excluded experimental patches:"
              cat "$DK_PROFILE/excluded-patches.sha256"
            } > files/build_info
            cp files/build_info "$DK_BIN/build_info"

            rm -rf tmp
            make defconfig
            for option in \
              CONFIG_TARGET_airoha_an7581_DEVICE_gemtek_w1700k-ubi=y \
              CONFIG_ALL_KMODS=y \
              CONFIG_SIGNED_PACKAGES=y \
              CONFIG_BUSYBOX_CONFIG_FLOCK=y \
              CONFIG_JSON_CYCLONEDX_SBOM=y \
              CONFIG_PACKAGE_apk-openssl=y \
              CONFIG_PACKAGE_dnsmasq-full=y \
              CONFIG_PACKAGE_dnsproxy=y \
              CONFIG_PACKAGE_irqbalance=y \
              CONFIG_PACKAGE_kmod-airoha-eth=y \
              CONFIG_PACKAGE_kmod-airoha-npu=y \
              CONFIG_PACKAGE_kmod-mt7996e=y \
              CONFIG_PACKAGE_kmod-nf-flow-bridge=y \
              CONFIG_PACKAGE_kmod-phy-rtl8261ce=y \
              CONFIG_PACKAGE_luci-app-airoha-flowsense=y \
              CONFIG_PACKAGE_luci-app-airoha-npu=y \
              CONFIG_PACKAGE_luci-app-filemanager=y \
              CONFIG_PACKAGE_luci-app-irqbalance=y \
              CONFIG_PACKAGE_luci-app-log-viewer=y \
              CONFIG_PACKAGE_luci-app-mlo=y \
              CONFIG_PACKAGE_luci-app-netspeedtest=y \
              CONFIG_PACKAGE_luci-app-package-manager=y \
              CONFIG_PACKAGE_luci-app-sqm=y \
              CONFIG_PACKAGE_luci-app-ttyd=y \
              CONFIG_PACKAGE_luci-app-watchcat=y \
              CONFIG_PACKAGE_luci-app-wifi7=y \
              CONFIG_PACKAGE_openssh-sftp-server=y \
              CONFIG_PACKAGE_ttyd=y \
              CONFIG_PACKAGE_u-boot-an7581_gemtek_w1700k=y \
              CONFIG_PACKAGE_w1700k-hw21-bouygues-support=y \
              CONFIG_PACKAGE_wpad-openssl=y; do
              grep -qx "$option" .config || {
                echo "::error::Required build option missing: $option"
                exit 1
              }
            done
            for forbidden in \
              CONFIG_PACKAGE_attendedsysupgrade-common \
              CONFIG_PACKAGE_bridge-flow-offload \
              CONFIG_PACKAGE_freeradius3 \
              CONFIG_PACKAGE_kmod-br-netfilter \
              CONFIG_PACKAGE_luci-app-attendedsysupgrade \
              CONFIG_PACKAGE_owut \
              CONFIG_PACKAGE_wpad-basic-mbedtls \
              CONFIG_PACKAGE_wpad-mbedtls; do
              if grep -qx "$forbidden=y" .config; then
                echo "::error::Forbidden build option enabled: $forbidden"
                exit 1
              fi
            done
            grep -qx "# CONFIG_PACKAGE_kmod-ipt-rtpengine is not set" .config
            grep -qx "# CONFIG_PACKAGE_dnsmasq is not set" .config
            ./scripts/diffconfig.sh > "$DK_BIN/config.diff"
            printf "CONFIG_VERSION_NUMBER=\"%s-v2.4\"\n" "$SOURCE_VERSION_CODE" >> .config

            download_log=$(mktemp)
            set +e
            make download -j8 2>&1 | tee "$download_log"
            status=${PIPESTATUS[0]}
            set -e
            if [ "$status" -ne 0 ] || grep -q "ERROR:" "$download_log"; then
              echo "::warning::Parallel download failed; retrying serially"
              make download -j1 V=s
            fi
            rm -f "$download_log"
          '

      - name: Compile OpenWrt and all native kmods
        run: |
          set -euo pipefail
          build_succeeded=false
          for mode in c s; do
            # shellcheck disable=SC2016
            if docker_exec -e MODE="$mode" DK bash -c '
              set -o pipefail
              cd "$DK_OPENWRT" || exit 1
              if [ -x "$DK_PROFILE/pre_compile.sh" ]; then
                "$DK_PROFILE/pre_compile.sh"
              fi
              export FORCE_UNSAFE_CONFIGURE=1
              export CCACHE_SLOPPINESS=file_stat_matches,include_file_mtime,time_macros
              export CCACHE_NOHASHDIR=true
              export CCACHE_COMPILERCHECK=content
              make -j$(($(nproc) + 1)) V="$MODE"
              status=$?
              staging_dir/host/bin/ccache -d /ghcache -sz || true
              exit "$status"
            '; then
              build_succeeded=true
              break
            fi
          done
          [ "$build_succeeded" = true ] || {
            echo "::error::OpenWrt compilation failed in compact and verbose modes"
            exit 1
          }

      - name: Validate image rootfs, kernel and package policy
        run: |
          # shellcheck disable=SC2016
          docker_exec DK bash -euo pipefail -c '
            cd "$DK_OPENWRT"
            mapfile -t roots < <(find build_dir -type d -name root-airoha -print)
            [ "${#roots[@]}" -eq 1 ] || {
              echo "::error::Expected one assembled Airoha rootfs, found ${#roots[@]}"
              exit 1
            }
            root=${roots[0]}
            release_tag=$(cat "$DK_BIN/release_tag")
            expected_repo="https://github.com/arnaud-devops/w1700k-hw21-bouygues-build/releases/download/$release_tag/w1700k-kmods.adb"

            for rel in \
              build_info \
              etc/apk/repositories.d/customfeeds.list \
              etc/config/ttyd \
              etc/hotplug.d/iface/95-dnsproxy-restore \
              etc/hotplug.d/net/50-flow-offload-wifi \
              etc/init.d/dnsproxy-restore \
              etc/init.d/w1700k-pstore \
              etc/uci-defaults/99-w1700k-hw21-bouygues-v24 \
              etc/w1700k-build-release \
              usr/local/sbin/restore-dnsproxy-after-sysupgrade \
              usr/local/sbin/w1700k-healthcheck \
              usr/local/sbin/w1700k-pstore-collect \
              usr/local/sbin/w1700k-watchcat-recover; do
              [ -s "$root/$rel" ] || {
                echo "::error::Required rootfs file missing: $rel"
                exit 1
              }
            done

            for rel in \
              etc/hotplug.d/iface/95-dnsproxy-restore \
              etc/hotplug.d/net/50-flow-offload-wifi \
              etc/init.d/dnsproxy-restore \
              etc/init.d/fan \
              etc/init.d/irqbalance \
              etc/init.d/librespeed-go \
              etc/init.d/npu-jitter \
              etc/init.d/ttyd \
              etc/init.d/watchcat \
              etc/init.d/w1700k-pstore \
              etc/uci-defaults/99-w1700k-hw21-bouygues-v24 \
              usr/bin/curl \
              usr/bin/flock \
              usr/bin/iperf3 \
              usr/bin/jq \
              usr/bin/librespeed-go \
              usr/bin/tcpdump \
              usr/bin/ttyd \
              usr/libexec/sftp-server \
              usr/libexec/tc-full \
              usr/local/sbin/restore-dnsproxy-after-sysupgrade \
              usr/local/sbin/w1700k-healthcheck \
              usr/local/sbin/w1700k-pstore-collect \
              usr/local/sbin/w1700k-watchcat-recover \
              usr/sbin/ethtool \
              usr/sbin/irqbalance \
              usr/sbin/nft \
              usr/sbin/wpad; do
              [ -x "$root/$rel" ] || {
                echo "::error::Required executable missing: $rel"
                exit 1
              }
            done

            for rel in \
              etc/hotplug.d/iface/51-bridge-flow-offload \
              etc/hotplug.d/net/50-nf-bridge-call \
              etc/vermagic.txt \
              usr/bin/fastfetch \
              usr/bin/owut \
              usr/bin/speedtest \
              usr/libexec/rpcd/luci.netspeedtest \
              usr/share/bridge-flow-offload \
              usr/share/luci/menu.d/luci-app-attendedsysupgrade.json \
              www/cgi-bin/github_check \
              www/cgi-bin/github_fetch \
              www/luci-static/resources/view/netspeedtest/speedtest.js; do
              [ ! -e "$root/$rel" ] || {
                echo "::error::Forbidden rootfs path present: $rel"
                exit 1
              }
            done

            for rel in \
              usr/share/luci/menu.d/luci-app-airoha-flowsense.json \
              usr/share/luci/menu.d/luci-app-airoha-npu.json \
              usr/share/luci/menu.d/luci-app-filemanager.json \
              usr/share/luci/menu.d/luci-app-irqbalance.json \
              usr/share/luci/menu.d/luci-app-log-viewer.json \
              usr/share/luci/menu.d/luci-app-mlo.json \
              usr/share/luci/menu.d/luci-app-netspeedtest.json \
              usr/share/luci/menu.d/luci-app-package-manager.json \
              usr/share/luci/menu.d/luci-app-sqm.json \
              usr/share/luci/menu.d/luci-app-ttyd.json \
              usr/share/luci/menu.d/luci-app-watchcat.json \
              usr/share/luci/menu.d/luci-app-wifi7.json \
              www/luci-static/resources/view/netspeedtest/webspeedtest.js; do
              [ -s "$root/$rel" ] || {
                echo "::error::Required LuCI file missing: $rel"
                exit 1
              }
            done

            [ "$(grep -Fxc "$expected_repo" \
              "$root/etc/apk/repositories.d/customfeeds.list")" -eq 1 ] || {
              echo "::error::Exact native package repository missing"
              exit 1
            }
            if grep -Eq "downloads\\.openwrt\\.org/.*/kmods/" \
              "$root"/etc/apk/repositories.d/*.list; then
              echo "::error::Official incompatible kmods feed remains"
              exit 1
            fi
            grep -Fqx "release_tag=$release_tag" "$root/etc/w1700k-build-release"
            grep -Fqx "builder_commit=${{ github.sha }}" "$root/etc/w1700k-build-release"
            cmp "$DK_OPENWRT/public-key.pem" \
              "$root/etc/apk/keys/public-key.pem"

            grep -Eq "^[[:space:]]*option interface .@lan.$" "$root/etc/config/ttyd"
            grep -Eq "^[[:space:]]*option command ./bin/login.$" "$root/etc/config/ttyd"
            grep -Eq "^[[:space:]]*option ssl .1.$" "$root/etc/config/ttyd"
            grep -Fq "https://www.nperf.com/fr/" \
              "$root/www/luci-static/resources/view/netspeedtest/webspeedtest.js"
            grep -Eq "^[[:space:]]*option enabled .0.$" \
              "$root/etc/config/librespeed-go"
            grep -Eq "^[[:space:]]*option enabled .0.$" \
              "$root/etc/config/npu-monitor"
            grep -Fq "meta l4proto { tcp, udp } flow offload @ft;" \
              "$root/usr/share/firewall4/templates/ruleset.uc"
            grep -Fq "flow_offloading_bridge" \
              "$root/usr/share/firewall4/templates/ruleset.uc"
            grep -Fq "flow_offloading_bridge" \
              "$root/etc/hotplug.d/net/50-flow-offload-wifi"
            grep -Fq "ubus call \"\\$hostapd_object\" get_status" \
              "$root/usr/local/sbin/restore-dnsproxy-after-sysupgrade"

            for firmware in \
              lib/firmware/airoha/en7581_MT7996_npu_data.bin \
              lib/firmware/airoha/en7581_MT7996_npu_rv32.bin \
              lib/firmware/mediatek/mt7996/mt7996_dsp.bin \
              lib/firmware/mediatek/mt7996/mt7996_rom_patch.bin \
              lib/firmware/mediatek/mt7996/mt7996_wa.bin \
              lib/firmware/mediatek/mt7996/mt7996_wm.bin \
              lib/firmware/rtl8261n.bin; do
              [ -s "$root/$firmware" ] || {
                echo "::error::Required firmware missing: $firmware"
                exit 1
              }
            done
            for module in \
              airoha-eth.ko \
              airoha_npu.ko \
              mt7996e.ko \
              nf_flow_table_bridge.ko \
              rtk-rtl8261ce-phy.ko; do
              [ "$(find "$root/lib/modules" -type f -name "$module" | wc -l)" -eq 1 ] || {
                echo "::error::Expected exactly one module: $module"
                exit 1
              }
            done

            mapfile -t kernel_configs < <(
              find build_dir/target-* -type f \
                -path "*/linux-airoha_an7581/linux-6.18.39/.config" -print
            )
            [ "${#kernel_configs[@]}" -ge 1 ] || {
              echo "::error::Final Linux configuration not found"
              exit 1
            }
            for kernel_config in "${kernel_configs[@]}"; do
              for option in \
                CONFIG_NET_AIROHA=m \
                CONFIG_NET_AIROHA_NPU=m \
                CONFIG_NF_FLOW_TABLE_BRIDGE=m \
                CONFIG_PSTORE=y \
                CONFIG_PSTORE_RAM=y \
                CONFIG_RTL8261CE_PHY=m; do
                grep -qx "$option" "$kernel_config" || {
                  echo "::error::Kernel option missing: $option"
                  exit 1
                }
              done
              grep -qx "# CONFIG_BRIDGE_NETFILTER is not set" "$kernel_config"
              grep -qx "# CONFIG_NET_AIROHA_SOE is not set" "$kernel_config"
            done

            mapfile -t dtbs < <(
              find build_dir -type f -name "image-an7581-w1700k-ubi.dtb" -print
            )
            [ "${#dtbs[@]}" -ge 1 ] || {
              echo "::error::Generated W1700K UBI DTB not found"
              exit 1
            }
            dtc=${kernel_configs[0]%/.config}/scripts/dtc/dtc
            [ -x "$dtc" ]
            for dtb in "${dtbs[@]}"; do
              dump=$("$dtc" -I dtb -O dts "$dtb" 2>/dev/null)
              ramoops=$(printf "%s\n" "$dump" |
                sed -n "/ramoops@86ff0000 {/,/};/p")
              printf "%s\n" "$ramoops" |
                grep -Eq "0x86ff0000[[:space:]]+0x0+[[:space:]]+0x10000"
              if printf "%s\n" "$dump" |
                grep -Eq "opp-hz = <0x0 (0x4a817c80|0x4d7c6d00|0x50775b80|0x53724a00|0x536e7e00)>"; then
                echo "::error::Generated DTB contains an overclock OPP"
                exit 1
              fi
            done
            cmp "$DK_BIN/build_info" "$root/build_info"
          '

      - name: Build signed native package repository
        run: |
          # shellcheck disable=SC2016
          docker_exec DK bash -euo pipefail -c '
            cd "$DK_OPENWRT"
            repo="$DK_BIN/repository"
            rm -rf "$repo"
            mkdir -p "$repo"
            target_packages="$DK_BIN/targets/airoha/an7581/packages"
            [ -d "$target_packages" ] || {
              echo "::error::Target package directory missing"
              exit 1
            }
            find -L "$target_packages" -maxdepth 1 -type f \
              \( -name "kernel-*.apk" -o -name "kmod-*.apk" \) \
              -exec cp -L -t "$repo" {} +

            # Keep exact recovery and custom UI packages available alongside
            # the complete native-kernel module set.
            for package in \
              dnsmasq-full \
              dnsproxy \
              firewall4 \
              hostapd-common \
              luci-app-airoha-flowsense \
              luci-app-airoha-npu \
              luci-app-log-viewer \
              luci-app-netspeedtest \
              luci-app-w1700k-fancontrol \
              w1700k-hw21-bouygues-support \
              wifi-scripts \
              wpad-openssl; do
              mapfile -t matches < <(
                find -L "$DK_BIN/targets" "$DK_BIN/packages" -type f \
                  -name "$package-*.apk" -print 2>/dev/null
              )
              [ "${#matches[@]}" -eq 1 ] || {
                echo "::error::Expected one APK for $package, found ${#matches[@]}"
                printf "%s\n" "${matches[@]}"
                exit 1
              }
              cp -L "${matches[0]}" "$repo/"
            done

            kmod_count=$(find "$repo" -maxdepth 1 -type f -name "kmod-*.apk" |
              wc -l)
            [ "$kmod_count" -ge 100 ] || {
              echo "::error::ALL_KMODS repository is unexpectedly small: $kmod_count"
              exit 1
            }
            apk_count=$(find "$repo" -maxdepth 1 -type f -name "*.apk" | wc -l)
            [ "$apk_count" -le 950 ] || {
              echo "::error::Repository exceeds GitHub release asset budget: $apk_count"
              exit 1
            }
            [ -s private-key.pem ] && [ -s public-key.pem ]
            (
              cd "$repo"
              "$DK_OPENWRT/staging_dir/host/bin/apk" mkndx \
                --root "$DK_OPENWRT" \
                --keys-dir "$DK_OPENWRT" \
                --allow-untrusted \
                --sign "$DK_OPENWRT/private-key.pem" \
                --output w1700k-kmods.adb \
                ./*.apk
              "$DK_OPENWRT/staging_dir/host/bin/apk" adbdump \
                --format json w1700k-kmods.adb > w1700k-kmods-index.json
              sha256sum ./*.apk w1700k-kmods.adb \
                w1700k-kmods-index.json > w1700k-kmods.sha256
            )
            grep -Eq "\"name\"[[:space:]]*:[[:space:]]*\"kmod-phy-rtl8261ce\"" \
              "$repo/w1700k-kmods-index.json"
            grep -Eq "\"name\"[[:space:]]*:[[:space:]]*\"kmod-airoha-eth\"" \
              "$repo/w1700k-kmods-index.json"
            grep -Eq "\"name\"[[:space:]]*:[[:space:]]*\"dnsproxy\"" \
              "$repo/w1700k-kmods-index.json"
            cp public-key.pem "$repo/w1700k-apk-public-key.pem"

            mapfile -t vermagics < <(
              find build_dir/target-* -type f \
                -path "*/linux-airoha_an7581/linux-6.18.39/.vermagic" -print
            )
            [ "${#vermagics[@]}" -ge 1 ]
            native_vermagic=$(cat "${vermagics[0]}")
            {
              echo "release_tag=$(cat "$DK_BIN/release_tag")"
              echo "kernel=6.18.39"
              echo "native_vermagic=$native_vermagic"
              echo "kmod_apk_count=$kmod_count"
              echo "total_apk_count=$apk_count"
              echo "public_key_sha256=$(sha256sum public-key.pem | cut -d\" \" -f1)"
              echo "source_commit=2d02d62666bd8f6ef89b193238c58984db592330"
              echo "builder_commit=${{ github.sha }}"
            } > "$repo/w1700k-kmods-info.txt"
          '

      - name: Stage and audit release artifacts
        run: |
          set -euo pipefail
          sudo chown -R "$(id -u):$(id -g)" openwrt_bin stcache
          rm -rf release
          mkdir -p release/firmware release/repository
          target_dir=openwrt_bin/targets/airoha/an7581
          shopt -s nullglob
          images=("$target_dir"/*sysupgrade.itb)
          manifests=("$target_dir"/*manifest)
          profiles=("$target_dir"/profiles.json)
          checksums=("$target_dir"/sha256sums)
          boms=("$target_dir"/*.bom.cdx.json)
          [ "${#images[@]}" -eq 1 ] || {
            echo "::error::Expected one sysupgrade ITB, found ${#images[@]}"
            exit 1
          }
          [ "${#manifests[@]}" -ge 1 ] && [ "${#profiles[@]}" -eq 1 ] &&
            [ "${#checksums[@]}" -eq 1 ] && [ "${#boms[@]}" -ge 1 ] || {
            echo "::error::Required OpenWrt metadata is incomplete"
            exit 1
          }
          cp "${images[@]}" "${manifests[@]}" "${profiles[@]}" \
            "${checksums[@]}" "${boms[@]}" release/firmware/
          cp openwrt_bin/build_info release/firmware/build-info.txt
          cp openwrt_bin/config.diff release/firmware/config.diff
          cp openwrt_bin/release_tag release/firmware/release-tag.txt
          cp -a openwrt_bin/repository/. release/repository/

          # Safety policy: firmware backups and source archives are never
          # release assets.
          if find release -type f \( -path '*/raw/*' -o -name '*.tar.gz' \) |
            grep -q .; then
            echo "::error::Sensitive/raw or tar.gz artifact was staged"
            exit 1
          fi

          manifest=${manifests[0]}
          for package in \
            airoha-en7581-mt7996-npu-firmware \
            apk-openssl \
            curl \
            dnsmasq-full \
            dnsproxy \
            dropbear \
            ethtool-full \
            firewall4 \
            hostapd-common \
            iperf3 \
            irqbalance \
            kmod-airoha-eth \
            kmod-airoha-npu \
            kmod-ifb \
            kmod-mt7996e \
            kmod-nf-flow-bridge \
            kmod-nft-offload \
            kmod-phy-rtl8261ce \
            kmod-sched-cake \
            luci-app-airoha-flowsense \
            luci-app-airoha-npu \
            luci-app-filemanager \
            luci-app-irqbalance \
            luci-app-log-viewer \
            luci-app-mlo \
            luci-app-netspeedtest \
            luci-app-package-manager \
            luci-app-sqm \
            luci-app-ttyd \
            luci-app-watchcat \
            luci-app-w1700k-fancontrol \
            luci-app-wifi7 \
            openssh-sftp-server \
            rtl826x-firmware \
            sqm-scripts \
            tcpdump \
            ttyd \
            watchcat \
            w1700k-hw21-bouygues-support \
            wpad-openssl; do
            grep -q "^$package - " "$manifest" || {
              echo "::error::Required image package missing: $package"
              exit 1
            }
          done
          for package in \
            attendedsysupgrade-common \
            bridge-flow-offload \
            bridger \
            dnsmasq \
            kmod-br-netfilter \
            luci-app-attendedsysupgrade \
            owut \
            wpad-basic-mbedtls \
            wpad-mbedtls; do
            if grep -q "^$package - " "$manifest"; then
              echo "::error::Forbidden image package present: $package"
              exit 1
            fi
          done
          grep -q "^hostapd-common - 2026\\.07\\.09~f08f2749-r2$" "$manifest"
          grep -q "^wpad-openssl - 2026\\.07\\.09~f08f2749-r2$" "$manifest"
          grep -q "^kmod-mt7996e - 6\\.18\\.39\\.2026\\.07\\.01~59676919-r1$" "$manifest"
          grep -q "^kmod-phy-rtl8261ce - 6\\.18\\.39-r1$" "$manifest"
          grep -q "^w1700k-hw21-bouygues-support - 2\\.4\\.0-r1$" "$manifest"

          image_name=${images[0]##*/}
          if ! awk -v name="$image_name" \
            '{ file=$2; sub(/^\\*/, "", file); if (file==name) found=1 }
             END { exit !found }' "$target_dir/sha256sums"; then
            echo "::error::OpenWrt checksum does not cover the sysupgrade image"
            exit 1
          fi
          (cd "$target_dir" && sha256sum --check --ignore-missing --quiet sha256sums)
          jq -e --arg image "$image_name" \
            '[.profiles[]?.images[]?.name] | index($image) != null' \
            "$target_dir/profiles.json" >/dev/null
          release_tag=$(cat openwrt_bin/release_tag)
          [[ "$release_tag" =~ ^[A-Za-z0-9._+-]+$ ]]
          if find release/repository -maxdepth 1 -type f -name '*.apk' |
            sed 's#^.*/##' | sort | uniq -d | grep -q .; then
            echo "::error::Duplicate APK asset basename"
            exit 1
          fi
          (
            cd release
            find firmware repository -type f -print0 |
              sort -z | xargs -0 sha256sum > release-sha256sums
          )
          find release -type f | sort

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: firmware-${{ matrix.target }}-${{ github.run_id }}
          path: release/
          if-no-files-found: error
          retention-days: 14

      - name: Attest critical release provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: |
            release/firmware/*sysupgrade.itb
            release/firmware/*manifest
            release/firmware/*.bom.cdx.json
            release/firmware/profiles.json
            release/firmware/build-info.txt
            release/firmware/config.diff
            release/repository/w1700k-kmods.adb
            release/repository/w1700k-kmods.sha256
            release/repository/w1700k-kmods-info.txt
            release/repository/w1700k-apk-public-key.pem
            release/release-sha256sums

      - name: Publish untested prerelease
        run: |
          set -euo pipefail
          release_tag=$(cat release/firmware/release-tag.txt)
          {
            echo "**UNTESTED ON PHYSICAL W1700K HW2.1. DO NOT FLASH YET.**"
            echo
            echo "## $release_tag"
            echo
            echo "Hurryman 25.07 base, Linux 6.18.39, native kernel ABI repository,"
            echo "UPDMEM 972+973, strict RTL8261CE binding and gated bridge offload."
            echo
            echo "The router was not modified by this build workflow."
            echo
            sed 's/^/    /' release/firmware/build-info.txt
          } > release/release-notes.txt

          firmware_assets=(
            release/firmware/*sysupgrade.itb
            release/firmware/*manifest
            release/firmware/*.bom.cdx.json
            release/firmware/profiles.json
            release/firmware/sha256sums
            release/firmware/build-info.txt
            release/firmware/config.diff
            release/firmware/release-tag.txt
            release/release-sha256sums
          )
          gh release create "$release_tag" "${firmware_assets[@]}" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "[UNTESTED ON HW2.1 - DO NOT FLASH YET] $release_tag" \
            --notes-file release/release-notes.txt

          find release/repository -maxdepth 1 -type f -print0 |
            xargs -0 -n 40 gh release upload "$release_tag"
          tag_target=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$release_tag" \
            --jq '.object.sha')
          [ "$tag_target" = "$GITHUB_SHA" ] || {
            echo "::error::Release tag points to $tag_target instead of $GITHUB_SHA"
            exit 1
          }
          expected_assets=$(find release/repository -maxdepth 1 -type f | wc -l)
          expected_assets=$((expected_assets + ${#firmware_assets[@]}))
          actual_assets=$(gh release view "$release_tag" --json assets \
            --jq '.assets | length')
          [ "$actual_assets" -eq "$expected_assets" ] || {
            echo "::error::Release asset count mismatch: expected=$expected_assets actual=$actual_assets"
            exit 1
          }

      - name: Delete old caches
        if: always()
        run: |
          for prefix in \
            dlcache. \
            cache-${{ matrix.target }}.${CACHE_EPOCH}.; do
            gh cache list --json key,id \
              --jq '.[] | select(.key | startswith("'"$prefix"'")) | .id' |
              xargs -r gh cache delete
          done || true

      - name: Prepare caches for save
        if: always()
        run: |
          sudo find stcache -type d -name 'root-*' -prune -exec rm -rf {} + || true
          sudo chown -R "$(id -u):$(id -g)" ghcache stcache dlcache || true

      - uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        if: always()
        with:
          path: |
            ghcache
            stcache
          key: ${{ steps.gh.outputs.cache-primary-key }}

      - uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        if: always()
        with:
          path: dlcache
          key: ${{ steps.dl.outputs.cache-primary-key }}
